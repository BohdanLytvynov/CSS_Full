<style>
  a:link{
    color: orange;
    text-decoration: none;
  }

  a:visited{
    color:blue;
    text-decoration: dotted;
  }

  a:hover{
    color: black;
  }

  a:active{
    color: rgb(162, 226, 67);
  }

  .dropdown-content a{
    display: none;
  }

  .dropdown:hover .dropdown-content a{
    display: block;
  }

  ul{
    margin-left: 20px;
    font-size: 40px;
    list-style-type: upper-roman;    
  }

  ul li:first-child{
    color: red;
  }

  ul li:last-child{
    color: green;
  }

  ul li:nth-child(2n + 1){
    color: blue;
  }
</style>
